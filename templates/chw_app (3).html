:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#e2e8f0;color:#0f172a;font-size:18px}
button,input,textarea{font-family:inherit}
@keyframes p2{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.5)}50%{box-shadow:0 0 0 16px rgba(225,29,72,0)}}
.rec{animation:p2 1s infinite}@keyframes sp{to{transform:rotate(360deg)}}.spin{animation:sp .8s linear infinite}
html{-webkit-text-size-adjust:100%}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media(max-width:359px){body{font-size:16px}}
@media(min-width:1024px){body{font-size:19px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}.cols>*{margin:0!important}}
@media(min-width:640px){body{padding:1rem 0}}
button[data-ld]{position:relative;pointer-events:none;cursor:wait}
button[data-ld]::after{content:"";position:absolute;right:14px;top:50%;margin-top:-10px;width:20px;height:20px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
button[data-ld][aria-busy="true"]::after{display:none}
button.w-12[data-ld] svg{opacity:0}
button.w-12[data-ld]::after{right:auto;left:50%;margin-left:-10px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media print{.noprint{display:none!important}}
</style>
</head>

<div class="p-4 sm:p-5 lg:p-8 space-y-3"><${Allergy}/>${!detectLangCode(tr&&tr.dialect)&&html`<div class="bg-white rounded-2xl p-4 space-y-2"><b>Playback language</b><p class="text-sm text-slate-600">No detected patient language is available. Choose a language for spoken instructions. The text remains in English.</p><div class="grid grid-cols-3 gap-2">${[['en','English'],['ha','Hausa'],['pcm','Nigerian Pidgin']].map(([k,l])=>html`<button key=${k} onClick=${()=>setTreatLang(k)} class=${`min-h-12 rounded-xl px-2 font-bold ${treatLang===k?'bg-teal-700 text-white':'bg-slate-200'}`}>${l}</button>`)}</div></div>`}${!plan&&((pt&&pt.is_pregnant)||(pt&&pt.age_years!=null&&pt.age_years<5)||(tri&&tri.tier==='RED'))&&html`<div class="bg-amber-100 border-l-8 border-amber-500 text-amber-950 rounded-2xl p-4 font-bold">Confirm care with a clinician or refer the patient. This patient is pregnant, under 5, or has RED triage.</div>`}
${planLoading&&html`<div class="bg-white rounded-2xl p-4 font-bold flex items-center gap-3"><${Icon} n="loader" c="spin"/>Preparing a guideline-based plan…</div>`}
${planError&&html`<div class="bg-amber-100 text-amber-950 rounded-2xl p-4 font-bold">${planError}</div>`}
${plan&&html`<div class="space-y-3">
${plan._saved&&html`<div class="bg-sky-100 text-sky-900 rounded-xl p-3 font-bold">Saved copy · Offline</div>`}
${plan.warnings&&plan.warnings.length&&html`<div class="bg-amber-100 border-l-8 border-amber-500 text-amber-950 rounded-2xl p-4 space-y-1"><b>Important warnings</b>${plan.warnings.map(w=>html`<p>${w}</p>`)}</div>`}
<div class="bg-white rounded-2xl p-4 space-y-2"><div class="font-bold text-lg">${plan.grounded?'From the treatment guidelines':'Not from guidelines. Check before use.'}</div>${plan.grounded&&plan.sources&&html`<p class="text-sm text-slate-700">${plan.sources.map(x=>x.source).join(' · ')}</p>`}</div>
<div class="space-y-3">${plan.instructions.map((x,i)=>html`<div key=${i} class="bg-white rounded-2xl shadow-sm p-4 space-y-3"><div class="font-bold">${i+1}. ${x.en}</div><${Btn} icon="volume" kind="teal" h="h-14" onClick=${()=>playGenerated(x,i)}>Play in ${LN[treatLang]}<//><label class="flex items-center gap-3 font-bold text-base"><input type="checkbox" checked=${!!confirmed[i]} onChange=${e=>setConfirmed(a=>({...a,[i]:e.target.checked}))} class="w-6 h-6"/>Confirm this instruction was explained</label></div>`)}</div>
<div class="bg-white rounded-2xl p-4 space-y-2"><b>Medication guidance</b><p>${plan.medications}</p><b>Referral advice</b><p>${plan.referral_advice}</p><b>Danger signs</b>${plan.danger_signs.map(x=>html`<p>• ${x}</p>`)}</div>
${plan.sources&&plan.sources.length&&html`<div class="bg-white rounded-2xl p-4 space-y-2"><${Btn} kind="link" h="h-10" onClick=${()=>setShowSources(!showSources)}>${showSources?'Hide sources':'Show source'}<//>${showSources&&plan.sources.map(x=>html`<div class="border-t pt-2"><b>${x.source}</b><p class="text-sm text-slate-700">${x.snippet}</p></div>`)}</div>`}
</div>`}
<div class="border-t-2 border-slate-300 pt-4 space-y-3"><h2 class="text-lg font-bold">Other instructions</h2><p class="text-sm text-slate-600">Fixed clinic phrases and your own instruction are available as a fallback.</p>
<div class="cols space-y-3">${phr.instructions.map(x=>html`<${Btn} key=${x.en} icon="volume" h="min-h-[64px] py-2" onClick=${async()=>{if(await play(x.en,x[treatLang]||null,treatLang))recordTold(x.en)}}>${x.en}<//>`)}</div>
<div class="bg-white rounded-2xl shadow-sm p-3 space-y-3"><label class="font-bold block">Your own instruction</label><textarea value=${tx} onInput=${e=>setTx(e.target.value)} rows="3" placeholder="Type any instruction for the patient, in English" class="w-full p-4 rounded-2xl bg-slate-200 outline-none placeholder-slate-600"/><${Btn} kind="teal" icon="play" off=${!tx.trim()} onClick=${async()=>{if(await play(tx.trim(),null,treatLang))recordTold(tx.trim())}}>Play in ${LN[treatLang]}<//></div></div>
${Who()}<${Btn} kind="teal" h="h-16" icon="check" onClick=${()=>finish('treatment')}>Save & Done<//></div></div>`;

if(sc==='refer'||sc==='emerg'){const E=sc==='emerg';const hosp=fac.filter(f=>!f.current);
/* One call: the server makes the patient (if only a name was typed), saves the whole visit and makes the code.
   Offline, the same request waits on the phone and is sent when signal returns. */
const go2=async()=>{if(!cid)return say('Choose a hospital');const nm=(pt?pt.full_name:em).trim();if(!pt&&nm.length<2)return say("Type the patient's name");
if(!reason.trim())return say('Tap why, or type it');
const body={...(pt?{patient_id:pt.id}:{patient_name:nm}),encounter_id:enc,center_id:cid,reason:reason.trim(),...clinical()};
if(off||(!navigator.onLine&&LIVE)){qAdd('/api/referral',body);setQueued(qGet().length);setSaved(true);say('Saved on phone. The code is made when signal returns. Send the patient to the hospital now.');return go('home')}
const r=await run('Making code…',()=>api('/api/referral',{json:body}));if(r){setTicket(r);if(r.encounter_id)setEnc(r.encounter_id);if(r.patient&&!pt)setPt(r.patient);setSaved(true);go('code')}};
b=html`<div><${Top} title=${E?'Emergency Referral':'Send to Hospital'} back=${E||ret==='home'?'home':'act'} a="GET /api/centers · POST /api/referral {patient_id | patient_name, encounter_id, center_id, reason, + visit fields} → {referral_code, referral_qr, facility}"/><${Off}/>
<div class="p-4 sm:p-5 lg:p-8 space-y-4">
${(E||!pt)&&html`<label class="h-16 bg-slate-200 rounded-2xl flex items-center gap-3 px-4"><${Icon} n="user"/><input value=${em} onInput=${e=>setEm(e.target.value)} placeholder="Patient name (only name needed)" class="flex-1 h-full bg-transparent outline-none placeholder-slate-600"/></label>`}
<${Allergy}/><h2 class="text-xl font-bold">Choose hospital</h2>
${!hosp.length&&html`<p class="bg-white rounded-2xl p-4 font-bold">${off?'Hospital list needs signal the first time.':'Loading hospitals…'}</p>`}
<div class="cols space-y-3">${hosp.map(f=>html`<button key=${f.id} onClick=${()=>setCid(f.id)} class=${`w-full min-h-[68px] rounded-2xl px-4 py-3 flex items-center gap-3 text-left font-bold ${cid===f.id?'bg-white ring-4 ring-teal-700 shadow-md':'bg-slate-200'}`}><${Icon} n=${cid===f.id?'check':'hospital'}/><span class="flex-1">${f.name}<span class="block font-normal text-base text-slate-700">${f.location}</span></span></button>`)}</div>
<h2 class="text-xl font-bold">Why? Tap all that apply</h2>
<div class="grid grid-cols-2 gap-2">${phr.reasons.map(x=>x.en).map(c=>html`<button key=${c} onClick=${()=>setReason(r=>r.includes(c)?r:(r?r+'; ':'')+c)} class=${`min-h-14 px-2 rounded-2xl font-bold flex items-center justify-center gap-2 ${reason.includes(c)?'bg-slate-900 text-white':'bg-slate-200'}`}>${reason.includes(c)&&html`<${Icon} n="check" s=${18}/>`}${c}</button>`)}</div>
<textarea value=${reason} onInput=${e=>setReason(e.target.value)} rows="2" placeholder="Reason" class="w-full p-4 rounded-2xl bg-slate-200 outline-none placeholder-slate-600"/>
<${Btn} kind=${E||(tri&&tri.tier==='RED')?'rose':'teal'} h="h-20" icon="qr" big="text-xl" onClick=${go2}>Make Referral Code<//>
</div></div>`}

if(sc==='code'&&ticket){const cells=Array.from({length:81},(_,i)=>((i*7+i%9*3+Math.floor(i/9)*5)%3===0)||[0,1,9,10,7,8,16,17,63,64,72,73].includes(i));
const who=ticket.patient_name||(pt&&pt.full_name)||'';
const shareIt=()=>{const t='SmartHealth referral code '+ticket.referral_code+' for '+who+' to '+ticket.facility;try{navigator.share({title:'Referral code',text:t}).catch(()=>{})}catch(e){say('Sharing is not available on this phone.')}};
b=html`<div><${Top} title="Referral Code" back="home"/><div class="p-4 sm:p-5 lg:p-8 space-y-4 text-center">
<div class="bg-white rounded-3xl shadow-md p-6 space-y-4">${ticket.referral_qr?html`<img src=${ticket.referral_qr} alt="QR" class="mx-auto w-52 h-52"/>`:html`<div class="mx-auto w-52 h-52 grid grid-cols-9 gap-0.5 p-2 border-4 border-slate-900 rounded-xl">${cells.map((c,i)=>html`<span key=${i} class=${c?'bg-slate-900':'bg-white'}/>`)}</div>`}
<div class="text-4xl font-bold tracking-widest font-mono">${ticket.referral_code}</div><p>${who} to ${ticket.facility}</p>${ticket.reason&&html`<p class="text-slate-700">${ticket.reason}</p>`}<p class="text-base text-slate-600">Saved to the patient's record.</p></div>
<div class="noprint space-y-3"><${Btn} icon="volume" onClick=${()=>play('Code '+ticket.referral_code.split('').join(' '))}>Read Code Aloud<//><${Btn} icon="print" onClick=${()=>window.print()}>Print Slip<//>
${typeof navigator.share==='function'&&html`<${Btn} icon="share" onClick=${shareIt}>Share Code<//>`}
<${Btn} kind="teal" h="h-16" icon="home" onClick=${()=>go('home')}>Done<//></div></div></div>`}

if(sc==='lookup'){const go3=async()=>{const r=await run('Looking up…',()=>api('/api/lookup',{json:{code:lk.trim()}}));if(r)setLr(r)};
const VL=[['temp','Temp','°C'],['hr','Pulse','/min'],['sys_bp','Top BP',''],['dia_bp','Bottom BP',''],['spo2','Oxygen','%']];
const vtxt=lr?VL.filter(([k])=>lr.vitals&&lr.vitals[k]!=null).map(([k,l,u])=>l+' '+lr.vitals[k]+u).join(' | '):'';
b=html`<div><${Top} title="Receive Referral" back="home" a="POST /api/lookup {code} → {patient, encounter_id, triage_tier, reason, diagnosis, medications, vitals} (receive_referral copies the record here)"/><${Off}/>
<div class="p-4 sm:p-5 lg:p-8 space-y-4"><label class="h-16 bg-slate-200 rounded-2xl flex items-center gap-3 px-4"><${Icon} n="qr"/><input value=${lk} onInput=${e=>setLk(e.target.value.toUpperCase())} placeholder="Code, e.g. MU-D457AJ" class="flex-1 h-full bg-transparent outline-none font-mono font-bold uppercase placeholder-slate-600"/></label>
<${Btn} kind="teal" h="h-16" icon="search" onClick=${go3}>Look Up<//>
${lr&&html`<div class="bg-white rounded-3xl shadow-md p-5 space-y-3"><div class="flex items-center justify-between"><b class="text-xl">${lr.patient_name}</b>${lr.triage_tier&&html`<${Chip} t=${lr.triage_tier}/>`}</div>
${lr.patient&&lr.patient.allergies&&html`<div class="bg-amber-100 border-l-8 border-amber-500 rounded-2xl p-3 flex items-center gap-3 font-bold"><${Icon} n="alert" c="text-amber-700"/>Allergy: ${lr.patient.allergies}</div>`}
<p class="text-slate-700">From ${lr.from_facility}</p><p><b>Reason:</b> ${lr.reason}</p>${lr.translation&&html`<p><b>Patient said:</b> ${lr.translation}</p>`}${lr.diagnosis&&html`<p><b>Cause:</b> ${lr.diagnosis}</p>`}${lr.medications&&html`<p><b>Treat:</b> ${lr.medications}</p>`}${lr.treatment_given&&lr.treatment_given.length&&html`<div class="bg-slate-100 rounded-xl p-3"><b>Patient was told:</b>${lr.treatment_given.map(x=>html`<p>${x}</p>`)}</div>`}${lr.triage_notes&&html`<p class="text-slate-700">${lr.triage_notes}</p>`}<p>${vtxt||'No vitals were sent.'}</p>
<${Btn} kind="teal" h="h-16" right="next" onClick=${()=>{reset();setSaved(true);setPt(lr.patient);setEnc(lr.encounter_id);setTri(lr.triage_tier?{tier:lr.triage_tier,trigger:'',notes:lr.triage_notes||''}:null);setDx(lr.diagnosis||'');setSym(lr.translation||lr.reason||'');const nv={};for(const k in LIM)if(lr.vitals&&lr.vitals[k]!=null)nv[k]=+lr.vitals[k];setVit(nv);go('assess')}}>Continue: Vitals & Cause<//></div>`}
</div></div>`}

return html`<main class="w-full max-w-md sm:max-w-2xl lg:max-w-4xl mx-auto bg-white min-h-[100dvh] shadow-xl"><div class="bg-slate-50 min-h-[100dvh] pb-10">${b}</div>
${busy&&html`<div class="noprint fixed inset-0 z-20 cursor-wait" aria-hidden="true"/>`}
${busy&&html`<div class="noprint fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white rounded-2xl px-5 py-3 shadow-md font-bold flex items-center gap-3 z-30"><${Icon} n="loader" c="spin"/><span>${busy}</span></div>`}
${toast&&html`<div role="status" class="noprint fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-2xl px-5 py-4 shadow-md font-bold flex items-center gap-2 z-30"><${Icon} n="alert"/><span>${toast}</span></div>`}</main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
/* offline shell: the service worker (static/sw.js) lets the app open without signal */
if(LIVE&&'serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
</script><!--{% endraw %}-->
</body>
</html>
