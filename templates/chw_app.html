const adj=(k,d,[lo,hi])=>setVit({...vit,[k]:Math.min(hi,Math.max(lo,+(vit[k]+d).toFixed(1)))});
const toAct=()=>{setReason(dx?'Suspected: '+dx:tri?'Triage Risk: '+tri.tier:'');go('act')};
b=html`<div><${Top} title="Vitals & Cause" step=${1} back="listen" a="POST /api/triage {patient_id?, encounter_id, temp, hr, sys_bp, dia_bp, spo2} (optional) · POST /api/diagnosis {encounter_id, symptoms} → {options}"/><${Off}/>
<div class=${`px-5 py-4 sticky top-0 z-10 shadow-md font-bold flex items-center gap-3 ${lt?TIER[lt][1]:'bg-slate-300 text-slate-900'}`}><${Icon} n=${lt==='RED'?'alert':'check'} s=${28}/><span class="text-xl">${skipV?'Vitals skipped':lt?TIER[lt][0]+': '+TIER[lt][2]:'Vitals are optional'}</span></div>
<div class="p-4 sm:p-5 lg:p-8 space-y-4"><${Allergy}/>
<div class="bg-white rounded-2xl shadow-sm p-4 space-y-2"><label class="font-bold block">What is wrong? Type in English</label>
<textarea value=${sym} onInput=${e=>setSym(e.target.value)} rows="3" placeholder="Example: headache and fever for 3 days" class="w-full p-4 rounded-2xl bg-slate-200 outline-none placeholder-slate-600"/>
${tr&&html`<p class="text-base text-slate-600">Brought in from the translation. You can edit it.</p>`}</div>
<div class="flex items-center justify-between gap-3"><h2 class="text-xl font-bold">Vitals</h2><button onClick=${()=>{setSkipV(!skipV);setTri(null)}} class="h-12 px-4 rounded-2xl font-bold bg-slate-200 flex items-center gap-2"><${Icon} n=${skipV?'plus':'next'} s=${20}/>${skipV?'Add vitals':'Skip vitals'}</button></div>
${skipV?html`<p class="bg-white rounded-2xl p-4">Vitals skipped. You can still get possible causes.</p>`:html`<div class="space-y-3">${lt&&lt!=='GREEN'&&html`<p class="font-bold">${tr2.join(', ')}</p>`}
${VS.map(([k,l,u,i,st,s0])=>html`<div key=${k} class="bg-white rounded-2xl shadow-sm p-3"><div class="flex items-center gap-2 font-bold mb-2"><${Icon} n=${i} c="text-teal-700"/>${l}${tr&&voiceV[k]!=null&&voiceV[k]===vit[k]&&html`<span class="font-normal text-base text-slate-600">from voice</span>`}</div>
${vit[k]==null?html`<${Btn} icon="plus" onClick=${()=>setVit({...vit,[k]:s0})}>Measured: add ${l}<//>`:html`<div class="grid grid-cols-3 gap-2 items-center"><${Btn} icon="minus" onClick=${()=>adj(k,-st,LIM[k])}>Less<//><div class="text-center text-3xl font-bold">${vit[k]}<span class="text-base text-slate-600">${u}</span></div><${Btn} icon="plus" onClick=${()=>adj(k,st,LIM[k])}>More<//></div>
<${Btn} kind="link" icon="x" cls="mt-1" onClick=${()=>{const v={...vit};delete v[k];setVit(v)}}>Not measured<//>`}</div>`)}</div>`}
<${Btn} kind=${ran?'grey':'teal'} h="h-16" icon="search" onClick=${()=>runAssess()}>${ran?'Update Tier & Causes':'Find Possible Causes'}<//>
${ran&&html`<div class="space-y-4">
${tri&&html`<div class=${`rounded-2xl p-4 font-bold ${TIER[tri.tier][1]}`}>${TIER[tri.tier][0]}: ${tri.trigger}</div>`}
<div class="bg-white rounded-3xl shadow-md p-5 space-y-3"><label class="font-bold text-xl block">Diagnosis</label>
<input value=${dx} onInput=${e=>setDx(e.target.value)} placeholder="Type a diagnosis" class="w-full h-16 px-4 rounded-2xl bg-slate-200 outline-none placeholder-slate-600"/>
<p class="text-base text-slate-600">Suggested automatically. Keep it or change it.</p></div>
<h2 class="text-xl font-bold">Possible causes</h2>
${!opts.length&&html`<p class="bg-white rounded-2xl p-4 font-bold">No suggestions right now. You can still type a diagnosis above.</p>`}
<div class="cols space-y-4">${opts.map((c,i)=>html`<div key=${c.name} class=${`bg-white rounded-3xl shadow-md p-5 space-y-2 ${dx===c.name?'ring-4 ring-teal-700':''}`}><div class="font-bold text-xl">${i+1}. ${c.name}</div>
${c.why&&html`<p><b>Why:</b> ${c.why}</p>`}${c.meds&&html`<p><b>Treat:</b> ${c.meds}</p>`}${c.adm&&html`<p><b>Hospital:</b> ${c.adm}</p>`}
<${Btn} kind="teal" h="h-16" icon="check" onClick=${()=>{setCause(c);setDx(c.name)}}>${dx===c.name?'Selected':'Select this cause'}<//></div>`)}</div></div>`}
${Who()}
<${Btn} kind="teal" h="h-16" right="next" onClick=${toAct}>Next: What to do<//>
<${Btn} icon="check" onClick=${()=>finish('diagnosis')}>Save & Done<//>
</div></div>`}

if(sc==='act'){const g=tri&&tri.tier==='GREEN';
const refer=html`<${Btn} key="r" kind=${tri&&tri.tier==='RED'?'rose':g?'grey':'teal'} h="h-20" icon="hospital" big="text-xl" onClick=${()=>{setRet('act');go('refer')}}>Send to Hospital<//>`;
const treat=html`<${Btn} key="t" kind=${g?'teal':'grey'} h="h-20" icon="user" big="text-xl" onClick=${()=>go('treat')}>Treat Here<//>`;
b=html`<div><${Top} title="What to do" step=${2} back="assess"/><div class="p-4 sm:p-5 lg:p-8 space-y-4">
<div class="bg-white rounded-2xl shadow-sm p-4 space-y-2"><div class="font-bold">${dx||'Diagnosis not set'}</div>${tri&&html`<div class="flex items-center gap-2"><${Chip} t=${tri.tier}/><span>${TIER[tri.tier][2]}</span></div>`}${tri&&html`<p class="text-slate-700">${tri.notes}</p>`}</div>
${g?[treat,refer]:[refer,treat]}</div></div>`}

if(sc==='treat') b=html`<div><${Top} title="Tell the Patient" back="act" a="POST /api/tts_instruction {text ≤500, language: en|ha|pcm} → {audio_url, translated_text}"/><${Off}/>
<div class="p-4 sm:p-5 lg:p-8 space-y-3"><${Allergy}/><${Lang}/>
<div class="cols space-y-3">${phr.instructions.map(x=>html`<${Btn} key=${x.en} icon="volume" h="min-h-[64px] py-2" onClick=${()=>play(x.en)}>${x.en}<//>`)}</div>
${Who()}<${Btn} kind="teal" h="h-16" icon="check" onClick=${()=>finish('treatment')}>Save & Done<//></div></div>`;

if(sc==='refer'||sc==='emerg'){const E=sc==='emerg';
const go2=async()=>{if(!cid)return say('Choose a hospital');let p=pt;
if(!p){p=await run('Saving patient',()=>api('/api/patients',{json:{full_name:em}}));if(!p)return;setPt(p)}
if(!reason.trim())return say('Tap why, or type it');
if(off){setQueued(queued+1);say('Saved on phone. Code is made when signal returns.');return go('home')}
const r=await run('Making code…',()=>api('/api/referral',{json:{patient_id:p.id,encounter_id:enc,center_id:cid,reason:reason.trim()}}));if(r){setTicket(r);go('code')}};
b=html`<div><${Top} title=${E?'Emergency Referral':'Send to Hospital'} back=${E||ret==='home'?'home':'act'} a="GET /api/centers · POST /api/referral {patient_id, encounter_id, center_id, reason} → {referral_code, referral_qr, facility}"/><${Off}/>
<div class="p-4 sm:p-5 lg:p-8 space-y-4">
${(E||!pt)&&html`<label class="h-16 bg-slate-200 rounded-2xl flex items-center gap-3 px-4"><${Icon} n="user"/><input value=${em} onInput=${e=>setEm(e.target.value)} placeholder="Patient name (only name needed)" class="flex-1 h-full bg-transparent outline-none placeholder-slate-600"/></label>`}
<${Allergy}/><h2 class="text-xl font-bold">Choose hospital</h2>
<div class="cols space-y-3">${fac.map(f=>html`<button key=${f.id} onClick=${()=>setCid(f.id)} class=${`w-full min-h-[68px] rounded-2xl px-4 py-3 flex items-center gap-3 text-left font-bold ${cid===f.id?'bg-white ring-4 ring-teal-700 shadow-md':'bg-slate-200'}`}><${Icon} n=${cid===f.id?'check':'hospital'}/><span class="flex-1">${f.name}<span class="block font-normal text-base text-slate-700">${f.location}</span></span></button>`)}</div>
<h2 class="text-xl font-bold">Why? Tap all that apply</h2>
<div class="grid grid-cols-2 gap-2">${phr.reasons.map(x=>x.en).map(c=>html`<button key=${c} onClick=${()=>setReason(r=>r.includes(c)?r:(r?r+'; ':'')+c)} class=${`min-h-14 px-2 rounded-2xl font-bold flex items-center justify-center gap-2 ${reason.includes(c)?'bg-slate-900 text-white':'bg-slate-200'}`}>${reason.includes(c)&&html`<${Icon} n="check" s=${18}/>`}${c}</button>`)}</div>
<textarea value=${reason} onInput=${e=>setReason(e.target.value)} rows="2" placeholder="Reason" class="w-full p-4 rounded-2xl bg-slate-200 outline-none placeholder-slate-600"/>
<${Btn} kind=${E||(tri&&tri.tier==='RED')?'rose':'teal'} h="h-20" icon="qr" big="text-xl" onClick=${go2}>Make Referral Code<//>
</div></div>`}

if(sc==='code'&&ticket){const cells=Array.from({length:81},(_,i)=>((i*7+i%9*3+Math.floor(i/9)*5)%3===0)||[0,1,9,10,7,8,16,17,63,64,72,73].includes(i));
b=html`<div><${Top} title="Referral Code" back="home"/><div class="p-4 sm:p-5 lg:p-8 space-y-4 text-center">
<div class="bg-white rounded-3xl shadow-md p-6 space-y-4">${ticket.referral_qr?html`<img src=${ticket.referral_qr} alt="QR" class="mx-auto w-52 h-52"/>`:html`<div class="mx-auto w-52 h-52 grid grid-cols-9 gap-0.5 p-2 border-4 border-slate-900 rounded-xl">${cells.map((c,i)=>html`<span key=${i} class=${c?'bg-slate-900':'bg-white'}/>`)}</div>`}
<div class="text-4xl font-bold tracking-widest font-mono">${ticket.referral_code}</div><p>${pt&&pt.full_name} to ${ticket.facility}</p><p class="text-base text-slate-600">Saved to the patient's record.</p></div>
<div class="noprint space-y-3"><${Btn} icon="volume" onClick=${()=>play('Code '+ticket.referral_code.split('').join(' '))}>Read Code Aloud<//><${Btn} icon="print" onClick=${()=>window.print()}>Print Slip<//>
<${Btn} kind="teal" h="h-16" icon="home" onClick=${()=>go('home')}>Done<//></div></div></div>`}

if(sc==='lookup'){const go3=async()=>{const r=await run('Looking up…',()=>api('/api/lookup',{json:{code:lk.trim()}}));if(r)setLr(r)};
b=html`<div><${Top} title="Receive Referral" back="home" a="POST /api/lookup {code} → {patient, encounter_id, triage_tier, reason, diagnosis, vitals} (receive_referral copies the record here)"/><${Off}/>
<div class="p-4 sm:p-5 lg:p-8 space-y-4"><label class="h-16 bg-slate-200 rounded-2xl flex items-center gap-3 px-4"><${Icon} n="qr"/><input value=${lk} onInput=${e=>setLk(e.target.value.toUpperCase())} placeholder="Code, e.g. MU-D457AJ" class="flex-1 h-full bg-transparent outline-none font-mono font-bold uppercase placeholder-slate-600"/></label>
<${Btn} kind="teal" h="h-16" icon="search" onClick=${go3}>Look Up<//>
${lr&&html`<div class="bg-white rounded-3xl shadow-md p-5 space-y-3"><div class="flex items-center justify-between"><b class="text-xl">${lr.patient_name}</b>${lr.triage_tier&&html`<${Chip} t=${lr.triage_tier}/>`}</div>
<p class="text-slate-700">From ${lr.from_facility}</p><p><b>Reason:</b> ${lr.reason}</p>${lr.diagnosis&&html`<p><b>Cause:</b> ${lr.diagnosis}</p>`}<p>Temp ${lr.vitals.temp!=null?lr.vitals.temp+'°C':'—'} | Oxygen ${lr.vitals.spo2!=null?lr.vitals.spo2+'%':'—'}</p>
<${Btn} kind="teal" h="h-16" right="next" onClick=${()=>{reset();setPt(lr.patient);setEnc(lr.encounter_id);setTri(lr.triage_tier?{tier:lr.triage_tier,trigger:'',notes:''}:null);setDx(lr.diagnosis||'');setSym(lr.reason||'');const nv={};for(const k in LIM)if(lr.vitals&&lr.vitals[k]!=null)nv[k]=+lr.vitals[k];setVit(nv);go('assess')}}>Continue: Vitals & Cause<//></div>`}
</div></div>`}

return html`<main class="w-full max-w-md sm:max-w-2xl lg:max-w-4xl mx-auto bg-white min-h-[100dvh] shadow-xl"><div class="bg-slate-50 min-h-[100dvh] pb-10">${b}</div>
${busy&&html`<div class="noprint fixed inset-0 z-20 cursor-wait" aria-hidden="true"/>`}
${busy&&html`<div class="noprint fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white rounded-2xl px-5 py-3 shadow-md font-bold flex items-center gap-3 z-30"><${Icon} n="loader" c="spin"/><span>${busy}</span></div>`}
${toast&&html`<div class="noprint fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-2xl px-5 py-4 shadow-md font-bold flex items-center gap-2 z-30"><${Icon} n="alert"/><span>${toast}</span></div>`}</main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script><!--{% endraw %}-->
</body>
</html>
